[package]
name = "hovertv"
version = "0.1.0"
description = "HoverTV Retro CRT Desktop Video Companion"
authors = ["Shaik Naseer John Ahmed"]
edition = "2021"

[lib]
name = "hovertv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
