<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HoverTV Companion</title>
  <style>
    body {
      width: 240px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      background: #1e1e1e;
      color: #e0e0e0;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #f5a623;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 9px 12px;
      margin-bottom: 8px;
      background: #333333;
      color: #ffffff;
      border: 1px solid #444444;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s ease;
    }
    .btn:hover {
      background: #444444;
      border-color: #f5a623;
    }
    .btn-primary {
      background: #d46b08;
      border-color: #f5a623;
    }
    .btn-primary:hover {
      background: #fa8c16;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      min-height: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h3>📺 HoverTV Companion</h3>
  <button id="btn-pipe" class="btn btn-primary">Send Video to HoverTV</button>
  <button id="btn-select" class="btn">Select Video Element</button>
  <div id="status"></div>
  <script src="dist/popup.js"></script>
</body>
</html>
